<style>
 :root{--bg:#fff;--phead:#223c66;--text:#1b2740;--muted:#6b7890;--line:#e4e8f0;
  --good:#00922f;--mid:#e08600;--bad:#f01c00;--accent:#1E4FA0;--soft:#f7f9fc;
  --zg:#37a05e;--zm:#e0a53a;--zb:#db5247}
 *{box-sizing:border-box;margin:0;padding:0}
 body{background:var(--bg);color:var(--text);font-family:'Open Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
 .wrap{max-width:1180px;margin:0 auto;padding:0 22px 60px}

 .hero{background:#fff;border:1px solid #eef1f6;border-radius:14px;box-shadow:0 4px 16px rgba(27,39,64,.06);overflow:hidden;margin-top:22px}
 .hero .stripe{height:5px;background:#c6a24e}
 .hero .hero-in{padding:24px 34px 22px}
 .hero .eye{font-family:Inter,sans-serif;font-weight:700;font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:#7fb0e8;margin-bottom:10px}
 .hero h1{font-family:Inter,sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:.02em;color:#1b2740;font-size:30px;line-height:1.05;margin:0}
 .hero .lead{font-size:14px;line-height:1.6;color:#aebfd8;max-width:600px;margin-top:11px}
 .hero .statrow{display:flex;flex-wrap:wrap;margin-top:15px}
 .hero .s{display:flex;flex-direction:column;padding:2px 26px}
 .hero .s:first-child{padding-left:0}
 .hero .s+.s{border-left:1px solid #edf0f5}
 .hero .s .n{font-family:'Ubuntu Mono';font-weight:700;font-size:19px;color:#1b2740;line-height:1}
 .hero .s .n.up{color:#00922f} .hero .s .n.down{color:#f01c00}
 .hero .s .l{font-size:10.5px;color:#8a95a6;margin-top:5px;white-space:nowrap}
 @media(max-width:640px){ .hero .hero-in{padding:20px 20px} .hero .s{padding:2px 13px} }

 .resbar{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 12px}
 .cnt{font-size:13.5px;font-weight:700}
 .sortsel{font-family:inherit;font-size:12.5px;font-weight:600;color:var(--muted);background:#fff;
   border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer}

 .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
 @media(max-width:980px){ .grid{grid-template-columns:1fr 1fr} }
 @media(max-width:640px){ .grid{grid-template-columns:1fr} }
 .card{border:1px solid var(--line);border-radius:14px;padding:0;background:#fff;overflow:hidden;
   color:inherit;display:block;transition:.14s}
 .chdr{background:#294876;color:#fff;padding:14px 18px 13px}
 .card:hover{border-color:#c3d3e8;box-shadow:0 8px 22px rgba(30,79,160,.09)}
 .chead{display:flex;justify-content:space-between;align-items:center;gap:8px}
 .cname{font-size:16px;font-weight:800;letter-spacing:.02em;color:#fff;text-decoration:none;text-transform:uppercase}
 .cname:hover{text-decoration:underline}
 .ccount{font-family:'Ubuntu Mono';font-size:15.5px;font-weight:700;color:#fff;background:rgba(255,255,255,.18);
   border-radius:11px;padding:2px 9px;flex:none}
 .cmeta{font-size:11.5px;color:rgba(255,255,255,.82);margin-top:6px;display:flex;flex-wrap:nowrap;white-space:nowrap;gap:5px 10px;align-items:baseline;justify-content:space-between}
 .cmeta b{font-family:'Ubuntu Mono';color:#fff;font-weight:700}
 .cmeta .up{color:#63d693} .cmeta .down{color:#ff8f80} .cmeta .dot{color:rgba(255,255,255,.4)}


 .colist{padding:6px 18px 12px}
 .colist .co{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px;color:var(--text);text-decoration:none;
   padding:6px 0;border-bottom:1px solid #f3f6fa}
 .colist .co .cn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .colist .co .cm{flex:none;font-family:'Ubuntu Mono';font-size:11.5px;font-weight:700;color:var(--muted)}
 .colist .co:last-child{border-bottom:none}
 .colist .co:hover{color:var(--accent)}

 .foot{font-size:11.5px;color:var(--muted);margin-top:20px;line-height:1.6}

<body>
<div id="am-nav"></div>
<div class="wrap">
 <section class="hero">
    <div class="stripe"></div>
    <div class="hero-in">
      <h1 data-i18n="sectors.h1">Ευρετήριο κλάδων</h1>
      <div class="statrow" id="summary"></div>
    </div>
  </section>

 <div class="resbar">
  <span class="cnt" id="cnt"></span>
  <select class="sortsel" id="sort" onchange="render()">
   <option value="n" data-i18n="sectors.sort.n">Πλήθος εταιρειών</option>
   <option value="name" data-i18n="sectors.sort.name">Αλφαβητικά</option>
   <option value="mcap" data-i18n="sectors.sort.mcap">Κεφαλαιοποίηση</option>
   <option value="cagr" data-i18n="sectors.sort.cagr">Ανάπτυξη τζίρου</option>
   </select>
 </div>

 <div class="grid" id="grid"></div>

 <div class="foot" data-i18n="sectors.foot">Οι εταιρείες κάθε κλάδου εμφανίζονται κατά φθίνουσα κεφαλαιοποίηση. Κλικ στο όνομα του κλάδου ανοίγει τη σελίδα του· κλικ σε εταιρεία τη σελίδα της. Η «ανάπτυξη τζίρου» είναι ο μέσος ετήσιος ρυθμός αύξησης του κύκλου εργασιών (CAGR) 2020–2025, σταθμισμένος κατά μέγεθος.</div>
</div>

<script>
AX_I18N.add({
 'sectors.title':{el:'Ευρετήριο κλάδων — Axion Metrics', en:'Sector index — Axion Metrics'},
 'sectors.h1':{el:'Ευρετήριο κλάδων', en:'Sector index'},
 'sectors.sort.n':{el:'Πλήθος εταιρειών', en:'By company count'},
 'sectors.sort.name':{el:'Αλφαβητικά', en:'Alphabetical'},
 'sectors.sort.mcap':{el:'Κεφαλαιοποίηση', en:'Market cap'},
 'sectors.sort.cagr':{el:'Ανάπτυξη τζίρου', en:'Revenue growth'},
 'sectors.foot':{el:'Οι εταιρείες κάθε κλάδου εμφανίζονται κατά φθίνουσα κεφαλαιοποίηση. Κλικ στο όνομα του κλάδου ανοίγει τη σελίδα του· κλικ σε εταιρεία τη σελίδα της. Η «ανάπτυξη τζίρου» είναι ο μέσος ετήσιος ρυθμός αύξησης του κύκλου εργασιών (CAGR) 2020–2025, σταθμισμένος κατά μέγεθος.', en:'Companies in each sector are shown by descending market cap. Clicking the sector name opens its page; clicking a company opens its page. “Revenue growth” is the size-weighted average annual growth rate of turnover (CAGR) 2020–2025.'},
 'sectors.revgrowth':{el:'Ανάπτυξη τζίρου', en:'Revenue growth'},
 'sectors.mcaplbl':{el:'Κεφ/ποίηση', en:'Market cap'},
 'sum.sectors':{el:'Κλάδοι', en:'Sectors'},
 'sum.companies':{el:'Εταιρείες', en:'Companies'},
 'sum.totmcap':{el:'Συν. κεφαλαιοποίηση', en:'Total market cap'},
 'sum.medpe':{el:'Διάμεση P/E', en:'Median P/E'},
 'sum.avggrowth':{el:'Μέση ανάπτυξη τζίρου', en:'Avg revenue growth'},
 'word.sectors':{el:'κλάδοι', en:'sectors'},
 'word.companies':{el:'εταιρείες', en:'companies'},
 'word.semesters':{el:'εξάμηνα', en:'semesters'},
 'unit.meur':{el:' εκ. €', en:' €M'}
});
function L(k){return AX_I18N.t(k);}
function SEC(n){return AX_I18N.sector(n);}
function curLang(){return window.AX_I18N?AX_I18N.lang:'el';}
function LOC(){return curLang()==='en'?'en-US':'el-GR';}

const SECTOR_PAGE='../sector/';
const COMPANY_PAGE='../company/';

const AXBASIS='annual'; /* Ευρετήριο κλάδων: μόνο ετήσια βάση (καμία εξαμηνιαία διάμεσος κλάδου) */
const DATA=((window.AXION&&window.AXION.rows&&window.AXION.rows[AXBASIS])||[]).filter(function(r){return r.calculated!==false;});
document.addEventListener('axion:basischange',function(){location.reload();});

const fmt=(v,d)=>(v==null||isNaN(v))?'—':v.toLocaleString(LOC(),{minimumFractionDigits:d,maximumFractionDigits:d});
const eur=v=>{if(v==null||isNaN(v))return '—';const m=v/1e6,a=Math.abs(m),d=a<100?2:a<1000?1:0;return m.toLocaleString(LOC(),{minimumFractionDigits:d,maximumFractionDigits:d})+L('unit.meur');};
const q=(arr,p)=>{const s=[...arr].sort((a,b)=>a-b),i=(s.length-1)*p,lo=Math.floor(i),hi=Math.ceil(i);return s[lo]+(s[hi]-s[lo])*(i-lo);};

const h32=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;};
const rng=seed=>{let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};};
const SEC_G={'Τράπεζες':6,'Ενέργεια':12,'Βιομηχανία':9,'Καταναλωτικά':7,'Εμπόριο':6,'Κατασκευές':14,'Τεχνολογία':16,'Ακίνητα':8,'Μεταφορές':18,'Υγεία':7};
const coCagr=r=>{const base=(SEC_G[r.s]??8), rd=rng(h32(r.t)); return base+(rd()-0.5)*8;};
const CAGR_Y=5;

const qn=(a,p)=>{const v=a.filter(x=>x!=null&&!isNaN(x));return v.length?q(v,p):null;};
const SECTORS=[...new Set(DATA.map(r=>r.s))].filter(s=>s&&s!=='—').map(name=>{
 const rows=DATA.filter(r=>r.s===name);
 const pes=rows.map(r=>r.pe).filter(x=>x!=null&&!isNaN(x));
 return {name, n:rows.length, rows,
   mcap: rows.reduce((a,r)=>a+(r.mcap||0),0),
   cagr: qn(rows.map(r=>r.cagr),.5),
   pe:  qn(pes,.5), q1:qn(pes,.25), q3:qn(pes,.75),
   lo:  pes.length?Math.min(...pes):null, hi:pes.length?Math.max(...pes):null,
   roe: qn(rows.map(r=>r.roe),.5),
   dy:  qn(rows.map(r=>r.dy),.5)};
});

const ALLPE=DATA.map(r=>r.pe).filter(x=>x!=null&&!isNaN(x));
const GLO=Math.min(...ALLPE), GHI=Math.max(...ALLPE);


function card(sec){
 const g=sec.cagr, gc=g>=0?'up':'down', gt=(g>=0?'+':'−')+fmt(Math.abs(g),1)+' %';
 const list = sec.rows
   .slice().sort((a,b)=>b.mcap-a.mcap)
   .map(r=>{
     const dead=r.trading===false?' co-dead':'';
     const dot=(r.trading===false&&r.tstatus)?`<span class="tdot ${r.tstatus.type==='delisted'?'t-del':'t-sus'}" title="${r.tstatus.label}"></span>`:((AXBASIS==='interim'&&r.interimPartial)?`<span class="tdot t-prov" title="${(r.h1n||1)}/2 ${L('word.semesters')}"></span>`:'');
     return `<a class="co${dead}" href="${COMPANY_PAGE}?tk=${encodeURIComponent(r.tk)}" target="_blank"><span class="cn">${dot}${r.t}</span><span class="cm">${eur(r.mcap)}</span></a>`;
   }).join('');
 return `<div class="card">
  <div class="chdr">
   <div class="chead">
     <a class="cname" href="${encodeURI(SECTOR_PAGE)}" target="_blank">${SEC(sec.name)}</a>
     <span class="ccount">${sec.n}</span>
   </div>
   <div class="cmeta">
     <span>${L('sectors.revgrowth')} <b class="${gc}">${gt}</b></span>
     <span>${L('sectors.mcaplbl')} <b>${eur(sec.mcap)}</b></span>
   </div>
  </div>
  <div class="colist">${list}</div>
 </div>`;
}

function render(){
 const s=document.getElementById('sort').value;
 let arr=[...SECTORS];
 if(s==='name') arr.sort((a,b)=>SEC(a.name).localeCompare(SEC(b.name),curLang()==='en'?'en':'el'));
 else arr.sort((a,b)=>b[s]-a[s]);
 document.getElementById('grid').innerHTML=arr.map(card).join('');
 document.getElementById('cnt').textContent=`${SECTORS.length} ${L('word.sectors')} · ${DATA.length} ${L('word.companies')}`;
}

function summary(){
 const totM=DATA.reduce((a,r)=>a+r.mcap,0);
 const rev0=DATA.reduce((a,r)=>a+r.mcap/Math.pow(1+coCagr(r)/100,CAGR_Y),0);
 const mkt=(Math.pow(totM/rev0,1/CAGR_Y)-1)*100;
 const gc=mkt>=0?'up':'down', gt=(mkt>=0?'+':'−')+fmt(Math.abs(mkt),1)+'%';
 const cells=[
  ['<span class="n">'+SECTORS.length+'</span>',L('sum.sectors')],
  ['<span class="n">'+DATA.length+'</span>',L('sum.companies')],
  ['<span class="n">'+eur(totM)+'</span>',L('sum.totmcap')],
  ['<span class="n">'+fmt(q(ALLPE,.5),1)+'</span>',L('sum.medpe')],
  ['<span class="n '+gc+'">'+gt+'</span>',L('sum.avggrowth')],
 ];
 document.getElementById('summary').innerHTML=cells.map(([n,l])=>`<div class="s">${n}<span class="l">${l}</span></div>`).join('');
}
summary(); render();
document.addEventListener('axion:langchange',function(){ summary(); render(); });
</script>
<div id="am-foot"></div>
<script>window.NAV_ACTIVE=1;window.NAV_CUR="Ευρετήριο κλάδων";window.AX_NO_BASIS=true;</script>
<script src="../assets/chrome.js"></script>
</body>
