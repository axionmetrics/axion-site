<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="me.title">Γεγονότα αγοράς — Axion Metrics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&family=Open+Sans:wght@400;600;700;800&family=Ubuntu+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
 :root{--bg:#fff;--phead:#223c66;--text:#1b2740;--muted:#6b7890;--line:#e4e8f0;
  --good:#00922f;--mid:#e08600;--bad:#f01c00;--accent:#1E4FA0;--soft:#f7f9fc;
  --zg:#37a05e;--zm:#e0a53a;--zb:#db5247}
 *{box-sizing:border-box;margin:0;padding:0}
 body{background:var(--bg);color:var(--text);font-family:'Open Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
 .wrap{max-width:1180px;margin:0 auto;padding:0 22px 60px}
 .mast{padding:26px 0 12px}
 .mast h1{font-size:28px;font-weight:800}
 .mast .sub{font-size:12.5px;color:var(--muted);margin-top:5px}

 .controls{background:#f4f6f9;border:1px solid #e4e8f0;border-left:3px solid #5a6b85;border-radius:12px;padding:14px 16px;margin-top:14px}
 .crow{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
 .crow + .crow{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
 .lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#9aa7b8;width:78px;flex:none}
 .chip{font-size:12.5px;font-weight:600;padding:6px 13px;border-radius:20px;border:1px solid var(--line);
   background:#fff;color:var(--muted);cursor:pointer;transition:.12s}
 .chip:hover{border-color:#c3d3e8;color:var(--text)}
 .chip.on{background:#33425c;border-color:#33425c;color:#fff}
 .chip.acc.on{background:#33425c;border-color:#33425c}
 .seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
 .seg button{font-family:inherit;font-size:12.5px;font-weight:600;padding:7px 14px;border:none;background:#fff;color:var(--muted);cursor:pointer}
 .seg button.on{background:#33425c;color:#fff}

 .resbar{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 10px}
 .resbar h2{font-size:17px;font-weight:800}
 .resbar .meta{font-size:12px;color:var(--muted)}

 table{width:100%;border-collapse:collapse;font-size:13px}
 thead th{background:var(--phead);color:#fff;font-weight:700;padding:9px 10px;font-size:11.5px;letter-spacing:.02em}
 thead th.l{text-align:left}
 tbody td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
 tbody tr:hover{background:#f4f7fc}
 td.rk{font-family:'Ubuntu Mono';font-weight:700;color:#b9c3d0;width:38px;text-align:center;font-size:14px}
 tbody tr.top3 td.rk{color:var(--accent)}
 td.nm{font-weight:700;font-size:14px}
 td.nm a{color:var(--text);text-decoration:none}
 td.nm a:hover{color:var(--accent)}
 td.sc{font-size:12px;color:var(--muted);width:130px}
 td.val{font-family:'Ubuntu Mono';font-weight:700;font-size:17px;text-align:right;width:96px}
 td.pct{width:280px;padding-right:16px}
 td.sec2{font-family:'Ubuntu Mono';font-size:13px;color:var(--muted);text-align:center;width:78px}
 .g{color:var(--good)}.m{color:var(--mid)}.b{color:var(--bad)}
 .pbar{position:relative;height:9px;border-radius:5px;background:#eef1f6;overflow:hidden}
 .pfill{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
 .pnum{font-family:'Ubuntu Mono';font-size:10px;color:#9aa7b8;margin-top:3px;display:block}

 .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}
 .card{border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;transition:.12s}
 .card:hover{border-color:#c3d3e8;box-shadow:0 6px 18px rgba(30,79,160,.07)}
 .card.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
 .card .bh{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#9aa7b8;margin-bottom:8px}
 .brow{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #eef1f6;font-size:12.5px}
 .brow:last-child{border-bottom:none}
 .brow .n{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .brow .v{font-family:'Ubuntu Mono';font-weight:700;font-size:13.5px;flex:none;margin-left:10px}

 h2.sec{font-size:16px;font-weight:800;margin:34px 0 4px}
 .sech{font-size:11.5px;color:var(--muted);margin-bottom:6px}
 .foot{font-size:11.5px;color:var(--muted);margin-top:20px;line-height:1.6}

 /* == ομογενοποίηση: κοινή τυπογραφία επικεφαλίδων == */
 .mast h1,h2,h2.sec{font-family:'Inter',sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:.02em}


 /* navy hero + secbox + picker (όπως στη σελίδα κλάδου) */
 .crumb{font-size:11.5px;color:#9aa7b8;padding:20px 0 0}
 .crumb a{color:var(--accent);text-decoration:none}
 .hero{background:var(--text);border-radius:14px;padding:16px 24px;margin-top:14px}
 .secbox{background:#fff;border:1px solid #eef1f6;border-radius:14px;box-shadow:0 4px 16px rgba(27,39,64,.06);overflow:hidden;margin-top:22px}
 .secbox .stripe{height:5px;background:#c6a24e}
 .secbox .hero-in{padding:24px 34px 22px}
 .secbox .hero-stats{display:flex;flex-wrap:wrap;margin-top:15px}
 .secbox .hs{display:flex;flex-direction:column;gap:3px;padding:2px 18px;max-width:210px}
 .secbox .hs:first-child{padding-left:0}
 .secbox .hs+.hs{border-left:1px solid #edf0f5}
 .secbox .hs .v{font-size:14px;font-weight:800;color:#1b2740;line-height:1.15}
 .secbox .hs .l{font-size:10.5px;color:#8a95a6;letter-spacing:.01em;line-height:1.3}
 .secbox h1{font-family:Inter,sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:.02em;color:#1b2740;font-size:30px;line-height:1.05;margin:0}
 .secbox .sub{font-size:13.5px;line-height:1.55;color:#aebfd8;margin-top:10px;max-width:640px}
 .secbox .hero-desc{font-size:13.5px;line-height:1.6;color:#55617a;margin-top:12px;max-width:680px}
 .hero .picker .chip{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.20);color:#cdd7e6}
 .hero .picker .chip:hover{border-color:rgba(255,255,255,.42);color:#fff}
 .hero .picker .chip.on{background:#fff;border-color:#fff;color:var(--phead)}
 @media(max-width:640px){.hero{padding:14px 16px}.secbox .hero-in{padding:20px 20px}.secbox .hs{padding:2px 14px}}
</style>
<style>
.me-flt{margin-top:20px}
.me-chips{display:flex;flex-wrap:wrap;gap:7px}
.me-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:6px 11px;border-radius:20px;border:1px solid #e0e5ee;background:#fff;cursor:pointer;color:#42506a;user-select:none}
.me-chip .dt{width:8px;height:8px;border-radius:50%}
.me-chip.off{opacity:.38}
.me-ctrl{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.me-ctrl select,.me-ctrl input{font-family:inherit;font-size:12.5px;border:1px solid #e0e5ee;border-radius:8px;padding:7px 10px;color:#42506a;background:#fff}
.me-ctrl input{flex:1;min-width:180px}
.me-cnt{font-size:12px;color:var(--muted);margin-top:13px}
.me-cnt b{color:var(--phead)}
.me-feed{margin-top:4px}
.me-yr{font-family:Inter,sans-serif;font-weight:800;font-size:15px;color:var(--phead);padding:16px 0 8px;border-bottom:1px solid var(--line);margin-bottom:2px;letter-spacing:.01em}
.me-ev{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid #f0f3f8}
.me-ev .dc{flex:none;width:42px;text-align:center;padding-top:1px}
.me-ev .dc b{display:block;font-family:'Ubuntu Mono',monospace;font-weight:700;font-size:16px;color:var(--text);line-height:1}
.me-ev .dc span{font-size:9.5px;color:#8a95a6;text-transform:uppercase;letter-spacing:.04em}
.me-ev .bar{flex:none;width:3px;align-self:stretch;border-radius:2px;min-height:32px}
.me-ev .bd{flex:1;min-width:0}
.me-ev .l1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.me-ev .co{font-family:Inter,sans-serif;font-weight:800;font-size:13px;color:var(--text)}
.me-ev .tk{font-family:'Ubuntu Mono',monospace;font-size:10.5px;color:#98a2b3}
.me-ev .pill{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px}
.me-ev .ds{font-size:12px;color:#4a5666;margin-top:3px;line-height:1.4}
.me-ev .sc{flex:none;font-size:10.5px;color:#8a95a6;padding-top:2px;text-align:right;max-width:110px}
.me-empty{font-size:12.5px;color:var(--muted);padding:20px 0}
.me-note{font-size:11.5px;color:var(--muted);margin-top:16px;line-height:1.5}
@media(max-width:560px){.me-ev .sc{display:none}}
</style>
<link rel="stylesheet" href="../assets/chrome.css">
<script src="../assets/data.js"></script>
<script src="../assets/i18n.js"></script>
</head>
<body>
<div id="am-nav"></div>
<div class="wrap">
 <div class="secbox">
    <div class="stripe"></div>
    <div class="hero-in">
      <h1 data-i18n="me.h1">Γεγονότα αγοράς</h1>
      <p class="hero-desc" data-i18n="me.desc">Εταιρικές πράξεις των εισηγμένων — διανομές, μεταβολές κεφαλαίου, εισαγωγές/διαγραφές, αλλαγές δεικτών — χρονολογικά, από το 2020.</p>
    </div>
  </div>
 <div class="me-flt">
  <div class="me-chips" id="meChips"></div>
  <div class="me-ctrl">
   <select id="meSector"><option value="" data-i18n="me.allsectors">Όλοι οι κλάδοι</option></select>
   <select id="meYear"><option value="" data-i18n="me.allyears">Όλα τα έτη</option><option>2025</option><option>2024</option><option>2023</option><option>2022</option><option>2021</option><option>2020</option></select>
   <input id="meSearch" type="text" data-i18n-ph="me.search" placeholder="Αναζήτηση εταιρείας ή γεγονότος…" autocomplete="off">
  </div>
 </div>
 <div class="me-cnt" id="meCnt"></div>
 <div class="me-feed" id="meFeed"></div>
</div>
<script>
AX_I18N.add({
 'me.title':{el:'Γεγονότα αγοράς — Axion Metrics', en:'Market events — Axion Metrics'},
 'me.h1':{el:'Γεγονότα αγοράς', en:'Market events'},
 'me.desc':{el:'Εταιρικές πράξεις των εισηγμένων — διανομές, μεταβολές κεφαλαίου, εισαγωγές/διαγραφές, αλλαγές δεικτών — χρονολογικά, από το 2020.', en:'Corporate actions of the listed companies — distributions, capital changes, listings/delistings, index changes — chronologically, from 2020.'},
 'me.allsectors':{el:'Όλοι οι κλάδοι', en:'All sectors'},
 'me.allyears':{el:'Όλα τα έτη', en:'All years'},
 'me.search':{el:'Αναζήτηση εταιρείας ή γεγονότος…', en:'Search company or event…'},
 'me.events':{el:'γεγονότα', en:'events'},
 'me.newestfirst':{el:'χρονολογικά, νεότερα πρώτα', en:'chronological, newest first'},
 'me.empty':{el:'Κανένα γεγονός δεν ταιριάζει με τα φίλτρα.', en:'No event matches the filters.'},
 'me.t.amk':{el:'Μετ.Κεφαλαίου', en:'Capital'},
 'me.t.div':{el:'Χρημ.Διανομές', en:'Distributions'},
 'me.t.listing':{el:'Εισαγωγές/Διαγραφές', en:'Listings/Delistings'},
 'me.t.index':{el:'Δείκτες', en:'Index changes'}
});
function L(k){return AX_I18N.t(k);}
function SEC(n){return AX_I18N.sector(n);}
function curLang(){return window.AX_I18N?AX_I18N.lang:'el';}

const TYPES={
 amk:{key:'me.t.amk',bg:'#e7eefb',tx:'#1E4FA0',bar:'#1E4FA0'},
 div:{key:'me.t.div',bg:'#f7edd8',tx:'#9a6a0c',bar:'#b07d10'},
 listing:{key:'me.t.listing',bg:'#e6f4ea',tx:'#1f7a3e',bar:'#2f9e52'},
 index:{key:'me.t.index',bg:'#e8ecf3',tx:'#223c66',bar:'#223c66'}
};
const EVENTS=(window.AXION&&window.AXION.marketEvents)||[];
const MON_EL=['Ιαν','Φεβ','Μαρ','Απρ','Μαι','Ιουν','Ιουλ','Αυγ','Σεπ','Οκτ','Νοε','Δεκ'];
const MON_EN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const norm=s=>s.toUpperCase().replace(/[ΆΑ]/g,'Α').replace(/[ΈΕ]/g,'Ε').replace(/[ΉΗ]/g,'Η').replace(/[ΊΪΙ]/g,'Ι').replace(/[ΌΟ]/g,'Ο').replace(/[ΎΫΥ]/g,'Υ').replace(/[ΏΩ]/g,'Ω');
let active=new Set(Object.keys(TYPES)), fSec='', fYear='', fQ='';

const chipsEl=document.getElementById('meChips');
function buildChips(){
 chipsEl.innerHTML=Object.entries(TYPES).map(([k,v])=>`<span class="me-chip${active.has(k)?'':' off'}" data-t="${k}"><span class="dt" style="background:${v.bar}"></span>${L(v.key)}</span>`).join('');
}
buildChips();
chipsEl.addEventListener('click',e=>{const c=e.target.closest('.me-chip');if(!c)return;const k=c.dataset.t;if(active.has(k)&&active.size>0){active.delete(k);c.classList.add('off');}else{active.add(k);c.classList.remove('off');}render();});

const secSel=document.getElementById('meSector');
const SECS=[...new Set(EVENTS.map(e=>e.s))].filter(s=>s).sort((a,b)=>a.localeCompare(b,'el'));
function buildSectorOptions(){
 const first=secSel.querySelector('option[value=""]');
 secSel.innerHTML=''; secSel.appendChild(first);
 SECS.forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=SEC(s);secSel.appendChild(o);});
 secSel.value=fSec;
}
buildSectorOptions();
secSel.addEventListener('change',e=>{fSec=e.target.value;render();});
document.getElementById('meYear').addEventListener('change',e=>{fYear=e.target.value;render();});
document.getElementById('meSearch').addEventListener('input',e=>{fQ=norm(e.target.value.trim());render();});

function render(){
 const MON=curLang()==='en'?MON_EN:MON_EL;
 const list=EVENTS.filter(e=>active.has(e.t)&&(!fSec||e.s===fSec)&&(!fYear||e.d.slice(0,4)===fYear)&&(!fQ||norm(e.co+' '+e.tk+' '+e.x).includes(fQ)))
   .sort((a,b)=>b.d.localeCompare(a.d));
 document.getElementById('meCnt').innerHTML=`<b>${list.length}</b> ${L('me.events')} · ${L('me.newestfirst')}`;
 const feed=document.getElementById('meFeed');
 if(!list.length){feed.innerHTML=`<div class="me-empty">${L('me.empty')}</div>`;return;}
 let html='', curY='';
 list.forEach(e=>{
  const y=e.d.slice(0,4);
  if(y!==curY){html+=`<div class="me-yr">${y}</div>`;curY=y;}
  const dd=+e.d.slice(8,10), mm=MON[+e.d.slice(5,7)-1], T=TYPES[e.t];
  html+=`<div class="me-ev"><div class="dc"><b>${dd}</b><span>${mm}</span></div><div class="bar" style="background:${T.bar}"></div><div class="bd"><div class="l1"><span class="co">${e.co}</span><span class="tk">${e.tk}</span><span class="pill" style="color:${T.tx};background:${T.bg}">${L(T.key)}</span></div><div class="ds">${e.x}</div></div><div class="sc">${SEC(e.s)}</div></div>`;
 });
 feed.innerHTML=html;
}
render();
document.addEventListener('axion:langchange',function(){ buildChips(); buildSectorOptions(); render(); });
</script>
<div id="am-foot"></div>
<script>window.NAV_ACTIVE=2;window.NAV_CUR="Γεγονότα αγοράς";</script>
<script src="../assets/chrome.js"></script>
</body>
</html>
