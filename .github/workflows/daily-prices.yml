name: Ημερήσιες τιμές (EOD)

on:
  schedule:
    - cron: '30 18 * * 1-5'
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths:
      - 'assets/data.js'

permissions:
  contents: write

concurrency:
  group: daily-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ενημέρωση τρεχουσών τιμών στο data.js
        run: python .github/scripts/daily_prices.py

      - name: Commit & push αν άλλαξε το data.js
        run: |
          if git diff --quiet -- assets/data.js; then
            echo "Καμία αλλαγή — δεν έγινε commit."
            exit 0
          fi
          git config user.name  "axion-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data.js
          git commit -m "daily: EOD τιμές $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push; then echo "OK pushed"; exit 0; fi
            git rebase --abort 2>/dev/null || true
            echo "retry $i ..."; sleep 5
          done
          echo "push failed after retries"; exit 1
