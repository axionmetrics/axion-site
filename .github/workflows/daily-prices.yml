name: "Τιμές EOD — Δευ–Παρ 18:05 · 19:05 · 21:35"

# Τρέχει αυτόματα μετά το κλείσιμο του ΧΑΑ (Δευ–Παρ) και ενημερώνει το
# assets/current.js με τις τρέχουσες τιμές/δείκτες από το Euronext Athens.
# ⚠ Γράφει ΜΟΝΟ το current.js (+ snapshots) — ΠΟΤΕ το data.js. Έτσι οι χειροκίνητες
# ενημερώσεις οικονομικών (γέφυρα → data.js) δεν σβήνουν τη μπάρα «Τρέχον».
#
# ══════════════════════════════════════════════════════════════════════════════════
# ΣΤΑΘΕΡΗ ΩΡΑ ΑΘΗΝΑΣ: 18:05 (κύρια) · 19:05 & 21:35 (εφεδρείες) — ΘΕΡΙΝΗ ΚΑΙ ΧΕΙΜΕΡΙΝΗ
# ══════════════════════════════════════════════════════════════════════════════════
# Το cron του GitHub είναι ΠΑΝΤΑ σε UTC και ΔΕΝ γνωρίζει θερινή/χειμερινή ώρα. Γι' αυτό
# δηλώνονται ΠΕΝΤΕ cron και ένα **φίλτρο εποχής** στην αρχή του job κρατά μόνο τα τρία
# της τρέχουσας εποχής. Το '5 16' είναι ΚΟΙΝΟ: 19:05 στη θερινή, 18:05 στη χειμερινή.
#
#   cron (UTC)   θερινή (+3)   χειμερινή (+2)
#   5 15         18:05         —
#   5 16         19:05         18:05
#   5 17         —             19:05
#   35 18        21:35         —
#   35 19        —             21:35
#
# ΓΙΑΤΙ ΤΟ ΦΙΛΤΡΟ ΕΛΕΓΧΕΙ ΕΠΟΧΗ ΚΑΙ ΟΧΙ ΩΡΑ: το GitHub καθυστερεί συστηματικά τα
# scheduled workflows 5–45′ σε ώρες αιχμής. Έλεγχος τύπου «είναι τώρα 18:05;» θα έκοβε
# τη σωστή εκτέλεση όποτε αργούσε. Η **εποχή** δεν αλλάζει μέσα σε 45 λεπτά.
#
# ΓΙΑΤΙ 18:05: τα τεστ του Σεπτεμβρίου 2026 έδειξαν τις τιμές κλεισίματος ενημερωμένες
# στις 18:05. ΓΙΑΤΙ 21:35 ΚΑΙ ΟΧΙ 21:05: στις 10/09 το feed έδειχνε `lastUpdated` = 21:30,
# άρα η τελευταία εφεδρεία πρέπει να έρχεται ΜΕΤΑ από εκείνη την ανανέωση.
#
# Γιατί οι πολλαπλές εκτελέσεις είναι ακίνδυνες — ΔΕΝ υπάρχει έλεγχος «έτρεξε ήδη;».
# Κάθε εκτέλεση ξαναχτίζει το current.js και το βήμα commit συγκρίνει το ΑΠΟΤΕΛΕΣΜΑ με
# ό,τι είναι στο repo: ίδιο → «Καμία αλλαγή, δεν έγινε commit». Έτσι οι εφεδρείες
# καλύπτουν ΚΑΙ αποτυχία (δεν γράφεται τίποτα) ΚΑΙ feed που δεν είχε ανανεωθεί ακόμα.
# Το `session_date()` σφραγίζει την ημερομηνία από το `lastUpdated` ΤΟΥ FEED
# (CLOSE_HOUR_ATH=18), όχι από την ώρα εκτέλεσης. Κάθε εκτέλεση γράφει στο summary το
# `lastUpdated` και την ημερομηνία που προέκυψε, ώστε να ελέγχεται.
on:
  schedule:
    - cron: '5 15 * * 1-5'       # → 18:05 Αθήνα σε ΘΕΡΙΝΗ (UTC+3) · κύρια
    - cron: '5 16 * * 1-5'       # → 19:05 σε ΘΕΡΙΝΗ · 18:05 σε ΧΕΙΜΕΡΙΝΗ (κοινό)
    - cron: '5 17 * * 1-5'       # → 19:05 Αθήνα σε ΧΕΙΜΕΡΙΝΗ (UTC+2) · εφεδρεία
    - cron: '35 18 * * 1-5'      # → 21:35 Αθήνα σε ΘΕΡΙΝΗ · εφεδρεία
    - cron: '35 19 * * 1-5'      # → 21:35 Αθήνα σε ΧΕΙΜΕΡΙΝΗ · εφεδρεία
  workflow_dispatch: {}          # χειροκίνητη εκτέλεση (κουμπί «Run workflow») για δοκιμή

permissions:
  contents: write

concurrency:
  group: daily-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # ── ΦΙΛΤΡΟ ΕΠΟΧΗΣ ────────────────────────────────────────────────────────────
      # Κρατά ΜΟΝΟ τα τρία cron της τρέχουσας εποχής της Ελλάδας, ώστε η πραγματική
      # ώρα εκτέλεσης να είναι ΠΑΝΤΑ 18:05 / 19:05 / 21:35 Αθήνας.
      #   θερινή  (UTC+3, +0300) → περνούν τα '5 15', '5 16', '35 18'
      #   χειμερινή (UTC+2, +0200) → περνούν τα '5 16', '5 17', '35 19'
      # Η χειροκίνητη εκτέλεση (workflow_dispatch) περνά ΠΑΝΤΑ.
      - name: Φίλτρο εποχής (θερινή/χειμερινή ώρα Αθήνας)
        id: gate
        run: |
          set -euo pipefail
          CRON='${{ github.event.schedule }}'
          OFFSET=$(TZ=Europe/Athens date +%z)
          NOW_ATH=$(TZ=Europe/Athens date '+%Y-%m-%d %H:%M')
          # ΣΥΓΚΡΙΣΗ ΣΥΜΒΟΛΟΣΕΙΡΩΝ, ΟΧΙ regex: το cron περιέχει '*', που σε regex σημαίνει
          # «επανάληψη» και δεν ταιριάζει ποτέ με τον εαυτό του. (Δοκιμασμένο λάθος.)
          case "$OFFSET" in
            +0300) SEASON='ΘΕΡΙΝΗ';    A='5 15 * * 1-5'; B='5 16 * * 1-5'; C='35 18 * * 1-5' ;;
            +0200) SEASON='ΧΕΙΜΕΡΙΝΗ'; A='5 16 * * 1-5'; B='5 17 * * 1-5'; C='35 19 * * 1-5' ;;
            *)     SEASON="ΑΓΝΩΣΤΗ($OFFSET)"; A="$CRON"; B="$CRON"; C="$CRON" ;;  # άγνωστο offset → ΠΟΤΕ δεν κόβουμε
          esac
          if [ -z "$CRON" ]; then
            RUN=true;  WHY='χειροκίνητη εκτέλεση — χωρίς φίλτρο'
          elif [ "$CRON" = "$A" ] || [ "$CRON" = "$B" ] || [ "$CRON" = "$C" ]; then
            RUN=true;  WHY="cron της τρέχουσας εποχής ($SEASON)"
          else
            RUN=false; WHY="cron της ΑΛΛΗΣ εποχής — σε $SEASON θα έπεφτε μία ώρα δίπλα"
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          {
            echo "| | |"
            echo "|---|---|"
            echo "| cron | \`${CRON:-—}\` |"
            echo "| offset Αθήνας | $OFFSET ($SEASON) |"
            echo "| ώρα Αθήνας | $NOW_ATH |"
            echo "| απόφαση | **$([ "$RUN" = true ] && echo '✅ ΕΚΤΕΛΕΙΤΑΙ' || echo '⏭ ΠΑΡΑΛΕΙΠΕΤΑΙ')** |"
            echo "| αιτία | $WHY |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.11'

      - name: Ενημέρωση τρεχουσών τιμών στο current.js
        if: steps.gate.outputs.run == 'true'
        run: python .github/scripts/daily_prices.py

      - name: Commit & push αλλαγές (current.js + snapshots)
        if: steps.gate.outputs.run == 'true'
        run: |
          git add assets/current.js snapshots/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Καμία αλλαγή — δεν έγινε commit."
          else
            git config user.name  "axion-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "daily: EOD τιμές + snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
