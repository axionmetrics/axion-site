name: "Τιμές EOD — Δευ–Παρ, από 18:05 Αθήνας"

# Τρέχει αυτόματα μετά το κλείσιμο του ΧΑΑ (Δευ–Παρ) και ενημερώνει το
# assets/current.js με τις τρέχουσες τιμές/δείκτες από το Euronext Athens.
# ⚠ Γράφει ΜΟΝΟ το current.js (+ snapshots) — ΠΟΤΕ το data.js. Έτσι οι χειροκίνητες
# ενημερώσεις οικονομικών (γέφυρα → data.js) δεν σβήνουν τη μπάρα «Τρέχον».
#
# ══════════════════════════════════════════════════════════════════════════════════
# ΠΕΝΤΕ ΕΥΚΑΙΡΙΕΣ ΤΗ ΜΕΡΑ — ΧΩΡΙΣ ΦΙΛΤΡΟ ΕΠΟΧΗΣ (22/09/2026)
# ══════════════════════════════════════════════════════════════════════════════════
# Το φίλτρο εποχής αφαιρέθηκε: μετρήσεις 21–22/09/2026 έδειξαν ότι το GitHub παραδίδει
# τα scheduled runs αυτού του repo με καθυστέρηση 3–4,5 ΩΡΩΝ (π.χ. cron 19:35 UTC →
# εκτέλεση 22:46 UTC). Με τέτοια ουρά δεν έχει νόημα να κρατάμε μόνο τα cron «της
# εποχής»: κάθε ευκαιρία μετράει, και όποιο run παραδοθεί πρώτο κάνει τη δουλειά.
#
#   cron (UTC)   θερινή (+3)   χειμερινή (+2)
#   5 15         18:05         17:05 → παραλείπεται από τον έλεγχο ώρας
#   5 16         19:05         18:05
#   5 17         20:05         19:05
#   35 18        21:35         20:35
#   35 19        22:35         21:35
#
# Οι πολλαπλές εκτελέσεις είναι ακίνδυνες — ΔΕΝ υπάρχει έλεγχος «έτρεξε ήδη;». Κάθε
# εκτέλεση ξαναχτίζει το current.js και το βήμα commit συγκρίνει το ΑΠΟΤΕΛΕΣΜΑ με ό,τι
# είναι στο repo: ίδιο → «Καμία αλλαγή, δεν έγινε commit».
#
# ⚠ Ο ΜΟΝΟΣ ΕΛΕΓΧΟΣ ΠΟΥ ΕΜΕΙΝΕ: «ΟΧΙ ΠΡΙΝ ΤΙΣ 18:00 ΑΘΗΝΑΣ». Δεν είναι φίλτρο εποχής,
# είναι δικλείδα δεδομένων. Το `session_date()` σφραγίζει ημερομηνία από το `lastUpdated`
# ΤΟΥ FEED με όριο CLOSE_HOUR_ATH=18: αν τρέξει ΠΡΙΝ τις 18:00 Αθήνας (στη χειμερινή το
# cron '5 15' πέφτει 17:05), το feed δίνει ΕΝΔΟΣΥΝΕΔΡΙΑΚΕΣ τιμές αλλά η ημερομηνία
# γράφεται ΧΘΕΣΙΝΗ → λάθος ζεύγος. Η καθυστέρηση του GitHub σπρώχνει πάντα ΑΡΓΟΤΕΡΑ,
# ποτέ νωρίτερα, άρα ο έλεγχος αυτός δεν κόβει ποτέ καθυστερημένο run.
on:
  schedule:
    # ⚠ ΜΟΝΟ ΔΙΚΤΥΩΤΟ ΑΣΦΑΛΕΙΑΣ (§111, 26/09/2026). Η ΚΥΡΙΑ διαδρομή είναι ο εξωτερικός
    # scheduler `axion-eod-trigger` του Cloudflare, που κάνει workflow_dispatch σε αυτή τη
    # ροή (§98). Οι τέσσερις προηγούμενες γραμμές (5 15 · 5 16 · 5 17 · 35 18) κόπηκαν:
    # υπήρχαν για να καλύψουν και τις δύο ζώνες ώρας όσο το cron ήταν η κύρια διαδρομή.
    # Αυτή μένει γιατί το `GH_TOKEN` του Worker ΛΗΓΕΙ 24/09/2027 — από εκείνη τη μέρα ο
    # Worker παίρνει 401 και σταματά σιωπηλά, ενώ το cron χρησιμοποιεί το `GITHUB_TOKEN`
    # του αποθετηρίου, που δεν λήγει. Καλύπτει επίσης σβησμένο/απενεργοποιημένο Worker,
    # σταματημένα cron triggers Cloudflare και λάθος σε μελλοντική επεξεργασία του κώδικα.
    # Περνά τη δικλείδα των 18:00 Αθήνας ΚΑΙ στη θερινή ΚΑΙ στη χειμερινή ώρα.
    # Τη μέρα που το Cloudflare έχει κάνει τη δουλειά, το `git diff --cached --quiet`
    # παρακάτω βρίσκει μηδέν αλλαγές -> κανένα commit, κανένα push, κανένας θόρυβος.
    - cron: '35 19 * * 1-5'      # → 22:35 σε ΘΕΡΙΝΗ · 21:35 σε ΧΕΙΜΕΡΙΝΗ
  workflow_dispatch: {}          # χειροκίνητη εκτέλεση (κουμπί «Run workflow») για δοκιμή

permissions:
  contents: write

concurrency:
  group: daily-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # ── ΔΙΚΛΕΙΔΑ: ΟΧΙ ΠΡΙΝ ΤΟ ΚΛΕΙΣΙΜΟ ────────────────────────────────────────────
      # Εκτελείται μόνο από τις 18:00 Αθήνας και μετά (= CLOSE_HOUR_ATH του script).
      # Νωρίτερα το feed δίνει ενδοσυνεδριακές τιμές με χθεσινή ημερομηνία συνεδρίασης.
      # Η χειροκίνητη εκτέλεση (workflow_dispatch) περνά ΠΑΝΤΑ — για δοκιμές.
      - name: Δικλείδα ώρας (≥ 18:00 Αθήνας)
        id: gate
        run: |
          set -euo pipefail
          CRON='${{ github.event.schedule }}'
          HOUR_ATH=$(TZ=Europe/Athens date +%H)
          NOW_ATH=$(TZ=Europe/Athens date '+%Y-%m-%d %H:%M')
          if [ -z "$CRON" ]; then
            RUN=true;  WHY='χειροκίνητη εκτέλεση — χωρίς δικλείδα'
          elif [ "$((10#$HOUR_ATH))" -ge 18 ]; then
            RUN=true;  WHY='μετά το κλείσιμο (≥ 18:00 Αθήνας)'
          else
            RUN=false; WHY='πριν τις 18:00 Αθήνας — το feed είναι ενδοσυνεδριακό'
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          {
            echo "| | |"
            echo "|---|---|"
            echo "| cron | \`${CRON:-—}\` |"
            echo "| ώρα Αθήνας | $NOW_ATH |"
            echo "| απόφαση | **$([ "$RUN" = true ] && echo '✅ ΕΚΤΕΛΕΙΤΑΙ' || echo '⏭ ΠΑΡΑΛΕΙΠΕΤΑΙ')** |"
            echo "| αιτία | $WHY |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.11'

      - name: Ενημέρωση τρεχουσών τιμών στο current.js
        if: steps.gate.outputs.run == 'true'
        run: python .github/scripts/daily_prices.py

      - name: Commit & push αλλαγές (current.js + snapshots)
        if: steps.gate.outputs.run == 'true'
        run: |
          git add assets/current.js snapshots/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Καμία αλλαγή — δεν έγινε commit."
          else
            git config user.name  "axion-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "daily: EOD τιμές + snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
