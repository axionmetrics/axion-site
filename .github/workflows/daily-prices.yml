name: "Τιμές EOD — Δευ–Παρ 19:30 & 21:30"

# Τρέχει αυτόματα μετά το κλείσιμο του ΧΑΑ (Δευ–Παρ) και ενημερώνει το
# assets/current.js με τις τρέχουσες τιμές/δείκτες από το Euronext Athens.
# ⚠ Γράφει ΜΟΝΟ το current.js (+ snapshots) — ΠΟΤΕ το data.js. Έτσι οι χειροκίνητες
# ενημερώσεις οικονομικών (γέφυρα → data.js) δεν σβήνουν τη μπάρα «Τρέχον».
#
# ══════════════════════════════════════════════════════════════════════════════════
# ΣΤΑΘΕΡΗ ΩΡΑ ΑΘΗΝΑΣ: 19:30 (νωρίς) και 21:30 (ασφάλεια) — ΚΑΙ ΘΕΡΙΝΗ ΚΑΙ ΧΕΙΜΕΡΙΝΗ
# ══════════════════════════════════════════════════════════════════════════════════
# Το cron του GitHub είναι ΠΑΝΤΑ σε UTC και ΔΕΝ γνωρίζει θερινή/χειμερινή ώρα. Γι' αυτό
# δηλώνονται ΤΕΣΣΕΡΑ cron — δύο ανά εποχή — και ένα **φίλτρο εποχής** στην αρχή του job
# σταματά όσα ανήκουν στην άλλη εποχή. Αποτέλεσμα: ΠΑΝΤΑ δύο πραγματικές εκτελέσεις
# την ημέρα, στις 19:30 και 21:30 ώρα Αθήνας, όλο τον χρόνο.
#
# ΓΙΑΤΙ ΤΟ ΦΙΛΤΡΟ ΕΛΕΓΧΕΙ ΕΠΟΧΗ ΚΑΙ ΟΧΙ ΩΡΑ: το GitHub καθυστερεί συστηματικά τα
# scheduled workflows 5–45′ σε ώρες αιχμής. Έλεγχος τύπου «είναι τώρα 21:30;» θα έκοβε
# τη σωστή εκτέλεση όποτε αργούσε. Η **εποχή** δεν αλλάζει μέσα σε 45 λεπτά — άρα το
# φίλτρο είναι ανθεκτικό στην καθυστέρηση. Η εκτέλεση μπορεί να αργήσει· δεν χάνεται.
#
# ⚠ ΜΕΤΡΗΜΕΝΟ (2026-09-10): το feed του Euronext δηλώνει `lastUpdated` = 21:30 Αθήνας.
# ΔΕΝ επιβεβαιώθηκε αν ξαναχτίζεται και νωρίτερα. Γι' αυτό η 21:30 ΜΕΝΕΙ ως ασφάλεια.
#
# Γιατί οι πολλαπλές εκτελέσεις είναι ακίνδυνες — ΔΕΝ υπάρχει έλεγχος «έτρεξε ήδη;».
# Κάθε εκτέλεση ξαναχτίζει το current.js και το βήμα commit συγκρίνει το ΑΠΟΤΕΛΕΣΜΑ με
# ό,τι είναι στο repo: ίδιο → «Καμία αλλαγή, δεν έγινε commit». Επιπλέον, το
# `session_date()` σφραγίζει την ημερομηνία από το `lastUpdated` ΤΟΥ FEED
# (CLOSE_HOUR_ATH=18), όχι από την ώρα εκτέλεσης — άρα πρόωρη εκτέλεση δεν παράγει ΠΟΤΕ
# λάθος ημερομηνία. Το πολύ ΕΝΑ commit την ημέρα, όσες φορές κι αν τρέξει.
#
# ΑΝ φανεί στα Actions ότι το commit έρχεται σταθερά από τις 19:30, τότε (και μόνο τότε)
# μπορούν να αφαιρεθούν τα δύο cron της 21:30 — ΜΑΖΙ με τις γραμμές τους στο φίλτρο.
on:
  schedule:
    - cron: '30 16 * * 1-5'      # → 19:30 Αθήνα ΜΟΝΟ σε ΘΕΡΙΝΗ (UTC+3) · νωρίς
    - cron: '30 17 * * 1-5'      # → 19:30 Αθήνα ΜΟΝΟ σε ΧΕΙΜΕΡΙΝΗ (UTC+2) · νωρίς
    - cron: '30 18 * * 1-5'      # → 21:30 Αθήνα ΜΟΝΟ σε ΘΕΡΙΝΗ (UTC+3) · ΑΣΦΑΛΕΙΑ
    - cron: '30 19 * * 1-5'      # → 21:30 Αθήνα ΜΟΝΟ σε ΧΕΙΜΕΡΙΝΗ (UTC+2) · ΑΣΦΑΛΕΙΑ
  workflow_dispatch: {}          # χειροκίνητη εκτέλεση (κουμπί «Run workflow») για δοκιμή

permissions:
  contents: write

concurrency:
  group: daily-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # ── ΦΙΛΤΡΟ ΕΠΟΧΗΣ ────────────────────────────────────────────────────────────
      # Κρατά ΜΟΝΟ τα δύο cron που αντιστοιχούν στην τρέχουσα εποχή της Ελλάδας, ώστε
      # η πραγματική ώρα εκτέλεσης να είναι ΠΑΝΤΑ 19:30 / 21:30 Αθήνας.
      #   θερινή  (UTC+3, +0300) → περνούν τα '30 16' και '30 18'
      #   χειμερινή (UTC+2, +0200) → περνούν τα '30 17' και '30 19'
      # Η χειροκίνητη εκτέλεση (workflow_dispatch) περνά ΠΑΝΤΑ.
      - name: Φίλτρο εποχής (θερινή/χειμερινή ώρα Αθήνας)
        id: gate
        run: |
          set -euo pipefail
          CRON='${{ github.event.schedule }}'
          OFFSET=$(TZ=Europe/Athens date +%z)
          NOW_ATH=$(TZ=Europe/Athens date '+%Y-%m-%d %H:%M')
          # ΣΥΓΚΡΙΣΗ ΣΥΜΒΟΛΟΣΕΙΡΩΝ, ΟΧΙ regex: το cron περιέχει '*', που σε regex σημαίνει
          # «επανάληψη» και δεν ταιριάζει ποτέ με τον εαυτό του. (Δοκιμασμένο λάθος.)
          case "$OFFSET" in
            +0300) SEASON='ΘΕΡΙΝΗ';    A='30 16 * * 1-5'; B='30 18 * * 1-5' ;;
            +0200) SEASON='ΧΕΙΜΕΡΙΝΗ'; A='30 17 * * 1-5'; B='30 19 * * 1-5' ;;
            *)     SEASON="ΑΓΝΩΣΤΗ($OFFSET)"; A="$CRON"; B="$CRON" ;;  # άγνωστο offset → ΠΟΤΕ δεν κόβουμε
          esac
          if [ -z "$CRON" ]; then
            RUN=true;  WHY='χειροκίνητη εκτέλεση — χωρίς φίλτρο'
          elif [ "$CRON" = "$A" ] || [ "$CRON" = "$B" ]; then
            RUN=true;  WHY="cron της τρέχουσας εποχής ($SEASON)"
          else
            RUN=false; WHY="cron της ΑΛΛΗΣ εποχής — σε $SEASON θα έπεφτε μία ώρα δίπλα"
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          {
            echo "| | |"
            echo "|---|---|"
            echo "| cron | \`${CRON:-—}\` |"
            echo "| offset Αθήνας | $OFFSET ($SEASON) |"
            echo "| ώρα Αθήνας | $NOW_ATH |"
            echo "| απόφαση | **$([ "$RUN" = true ] && echo '✅ ΕΚΤΕΛΕΙΤΑΙ' || echo '⏭ ΠΑΡΑΛΕΙΠΕΤΑΙ')** |"
            echo "| αιτία | $WHY |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.11'

      - name: Ενημέρωση τρεχουσών τιμών στο current.js
        if: steps.gate.outputs.run == 'true'
        run: python .github/scripts/daily_prices.py

      - name: Commit & push αλλαγές (current.js + snapshots)
        if: steps.gate.outputs.run == 'true'
        run: |
          git add assets/current.js snapshots/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Καμία αλλαγή — δεν έγινε commit."
          else
            git config user.name  "axion-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "daily: EOD τιμές + snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
