name: "Ισοτιμίες ΕΚΤ — Δευ–Παρ, μετά τη δημοσίευση"

# §160 — Αντλεί τις ημερήσιες ισοτιμίες αναφοράς της ΕΚΤ και τις δημοσιεύει σε ΔΥΟ αρχεία,
# ώστε να τις διαβάζει η κάθε εργασία όποτε τις θέλει:
#   .github/fx/rates.json   latest + ιστορικό (python jobs, γέφυρα)
#   assets/fx.js            window.AXION_FX (σελίδες — ίδιο μοτίβο με το current.js)
#
# ⚠ ΓΙΑΤΙ ΧΡΕΙΑΖΕΤΑΙ: τα κατώφλια της MSCI είναι σε δολάρια και η 141 CMF δημοσιεύει σε
# δολάρια. Μέχρι τώρα η ισοτιμία ερχόταν χειροκίνητα από το φύλλο ΙΣΟΤΙΜΙΕΣ (κλείσιμο
# περιόδου), που είναι ΣΩΣΤΟ για τους ισολογισμούς (§103) αλλά ΛΑΘΟΣ για ζωντανά κατώφλια.
#
# ⚠ Η ΕΚΤ ΔΗΜΟΣΙΕΥΕΙ ΜΟΝΟ ΕΡΓΑΣΙΜΕΣ, ~16:00 CET. Αν το run πέσει νωρίτερα ή σε αργία, το
# script απλώς δεν βρίσκει νέα παρατήρηση και ΚΡΑΤΑ την τελευταία διαθέσιμη μαζί με την
# ημερομηνία της· ο καταναλωτής υπολογίζει μόνος του πόσο παλιά είναι.
#
#   cron (UTC)   θερινή (+2 CEST)   χειμερινή (+1 CET)
#   5 15         17:05              16:05
#   5 17         19:05              18:05
#   5 19         21:05              20:05
#
# Οι πολλαπλές εκτελέσεις είναι ΑΚΙΝΔΥΝΕΣ: χωρίς νέο δεδομένο το script δεν αγγίζει καν τα
# αρχεία («καμία αλλαγή»), οπότε δεν γίνεται commit.

on:
  schedule:
    - cron: '5 15 * * 1-5'
    - cron: '5 17 * * 1-5'
    - cron: '5 19 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fx-rates
  cancel-in-progress: false

jobs:
  fx:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Άντληση ισοτιμιών ΕΚΤ
        id: fx
        run: |
          set -euo pipefail
          python .github/scripts/fx_rates.py --job | tee /tmp/fx.log
          {
            echo '```'
            cat /tmp/fx.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit & push (.github/fx/ + assets/fx.js)
        run: |
          git add .github/fx/ assets/fx.js 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Καμία αλλαγή — δεν έγινε commit."
          else
            git config user.name  "axion-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "fx: ισοτιμίες ΕΚΤ $(date -u +%Y-%m-%d)"
            # Ίδιο μοτίβο με daily-prices.yml / euronext-monitor.yml: τρία bot και ο χρήστης
            # σπρώχνουν στο ίδιο branch· σκέτο push τρώει non-fast-forward ΑΘΟΡΥΒΑ.
            # Τα αρχεία αυτής της ροής (.github/fx/, assets/fx.js) δεν τα αγγίζει καμία άλλη.
            for i in 1 2 3 4 5; do
              git fetch origin ${{ github.ref_name }}
              if git rebase origin/${{ github.ref_name }} && git push; then
                echo "OK pushed"; exit 0
              fi
              git rebase --abort 2>/dev/null || true
              echo "retry $i ..."; sleep 5
            done
            echo "push failed after retries"; exit 1
          fi
