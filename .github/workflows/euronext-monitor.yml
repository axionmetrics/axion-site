name: Euronext Monitor (εβδομαδιαίο)

# Ανιχνεύει αλλαγές εταιρικών γεγονότων από το Euronext Athens και
# ΑΝΑΦΕΡΕΙ (Issue + job summary). ΔΕΝ αλλάζει το data.js ούτε το master.

on:
  schedule:
    # Κάθε Παρασκευή 06:00 UTC (~09:00 Αθήνα θέρος / 08:00 χειμώνα)
    - cron: '23 6 * * 5'
  workflow_dispatch: {}

permissions:
  contents: write   # για commit του snapshot
  issues: write     # για δημιουργία Issue αναφοράς

concurrency:
  group: euronext-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Εγκατάσταση εξαρτήσεων
        run: pip install --quiet beautifulsoup4

      - name: Έλεγχος Euronext
        id: run
        run: python .github/scripts/euronext_monitor.py

      - name: Commit snapshot + ουρά (αν άλλαξαν)
        run: |
          # Stage ΠΡΩΤΑ ώστε να πιάνονται και τα untracked αρχεία (π.χ. το πρώτο snapshot.json)·
          # το `git diff --quiet` χωρίς staging αγνοεί τα untracked και το baseline δεν γινόταν ποτέ commit.
          git add -A .github/monitor/
          if git diff --cached --quiet; then
            echo "Καμία μεταβολή state — χωρίς commit."
            exit 0
          fi
          git config user.name  "axion-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "monitor: snapshot $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git fetch origin ${{ github.ref_name }}
            if git rebase origin/${{ github.ref_name }} && git push; then
              echo "OK pushed"; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "retry $i ..."; sleep 5
          done
          echo "push failed after retries"; exit 1

      # ΔΙΟΡΘΩΣΗ 2026-09-05: το Issue δημιουργούνταν ΧΩΡΙΣ label και ΧΩΡΙΣ assignee,
      # οπότε δεν έφτανε ειδοποίηση (Issues #3 στις 28/08 και #5 στις 04/09 έμειναν
      # απαρατήρητα). Τρεις αλλαγές:
      #   1. Το label «monitor» δημιουργείται αν λείπει — πριν, το `--label monitor`
      #      αποτύγχανε και το `2>/dev/null` έκρυβε το σφάλμα.
      #   2. Το Issue ανατίθεται στον κάτοχο του repo· ο assignee ειδοποιείται ΠΑΝΤΑ,
      #      ανεξάρτητα από ρυθμίσεις watch.
      #   3. `always()` ώστε η ειδοποίηση να φεύγει ακόμη κι αν αποτύχει το commit,
      #      και ΚΑΜΙΑ απόκρυψη σφαλμάτων — αν δεν φτιαχτεί το Issue, το job κοκκινίζει
      #      και το GitHub στέλνει email αποτυχίας.
      - name: Άνοιγμα Issue αναφοράς (μόνο αν υπάρχουν αλλαγές)
        if: always() && steps.run.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          TITLE="🛰️ Euronext Monitor — $(date -u +%Y-%m-%d): εντοπίστηκαν αλλαγές"

          # Το label μπορεί να μην υπάρχει ακόμη — φτιάξ' το (αθόρυβα αν υπάρχει ήδη).
          gh label create monitor --color 1D76DB \
            --description "Αυτόματες αναφορές Euronext Monitor" || true

          # Το @mention μπαίνει ΜΕΣΑ στο σώμα: ειδοποιεί σίγουρα και δεν μπορεί να
          # αποτύχει σαν κλήση API (σε αντίθεση με το --assignee).
          BODY="$RUNNER_TEMP/issue_body.md"   # εκτός repo, να μη μείνει αδέσποτο αρχείο
          printf '@%s\n\n' "$OWNER" > "$BODY"
          cat .github/monitor/last_report.md >> "$BODY"

          URL=$(gh issue create \
            --title "$TITLE" \
            --body-file "$BODY" \
            --label monitor)
          echo "Δημιουργήθηκε: $URL"
          echo "Δημιουργήθηκε Issue: $URL" >> "$GITHUB_STEP_SUMMARY"

          # Δεύτερο δίχτυ: ανάθεση. Αν ο owner είναι οργανισμός θα αποτύχει —
          # δεν ρίχνει το job, το @mention έχει ήδη κάνει τη δουλειά.
          gh issue edit "$URL" --add-assignee "$OWNER" \
            || echo "::warning::Απέτυχε η ανάθεση στον $OWNER (το @mention ισχύει)"
