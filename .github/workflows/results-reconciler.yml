# results-reconciler.yml
# Θέση στο repo:  .github/workflows/results-reconciler.yml
#
# Ελέγχει ποιες εταιρείες δημοσίευσαν αποτελέσματα περιόδου (ετήσια + 6μηνο)
# στο Euronext Financial Calendar αλλά ΔΕΝ είναι ακόμη live στο data.js
# (reported=false). ΔΕΝ αλλάζει master ούτε data.js — μόνο αναφέρει.
#
# Λογική issue (χωρίς spam):
#   • has_new=true  -> ενημερώνει ΕΝΑ σταθερό open issue (label: reconciler),
#                      ή το δημιουργεί αν δεν υπάρχει.
#   • has_new=false -> κλείνει το open issue (όλα live).
name: "Δημοσιεύσεις αποτελεσμάτων — Δευ/Τετ/Παρ πρωί"

on:
  schedule:
    # §88 — ΣΥΧΝΟΤΗΤΑ ΜΕ ΒΑΣΗ ΤΑ ΠΑΡΑΘΥΡΑ ΔΗΜΟΣΙΕΥΣΗΣ.
    #
    # Ν. 3556/2007 (Οδηγία Διαφάνειας): ετήσια οικονομική έκθεση έως **4 μήνες** μετά τη
    # λήξη της χρήσης (άρθρο 4) → 30 Απριλίου για χρήση 31/12· εξαμηνιαία έως **3 μήνες**
    # μετά τη λήξη του α΄ εξαμήνου (άρθρο 5) → 30 Σεπτεμβρίου. Τριμηνιαίες: καταργημένες.
    #
    # ΜΕΤΡΗΣΗ στις 137 δικές μας δημοσιεύσεις (publications.json):
    #   ετήσιες (79)     : Φεβ 6 · Μαρ 29 · **Απρ 42** · Μάι 1 · Οκτ 1   (30 μόνο στις 21-30/4)
    #   εξαμηνιαίες (58) : Μαρ 2 · Ιουλ 10 · Αυγ 10 · **Σεπ 36**
    #   → ΚΑΘΕ ΜΙΑ από τις 137 πέφτει στους μήνες 2-5 ή 7-10. Καμία εξαίρεση.
    #
    # Γι' αυτό: Δευ/Τετ/Παρ μέσα στα δύο παράθυρα, **Παρασκευή** εκτός. Το εκτός-παραθύρου
    # τρέξιμο ΔΕΝ καταργείται: οι μη-ημερολογιακές χρήσεις και οι εκπρόθεσμες δημοσιεύσεις
    # υπάρχουν (Μάιος, Οκτώβριος) και ένα σκληρό εποχικό κλείδωμα θα τις έχανε.
    - cron: '10 6 * 2-5,7-10 1,3,5'   # παράθυρα δημοσίευσης → Δευ/Τετ/Παρ
    - cron: '10 6 * 1,6,11,12 5'      # νεκροί μήνες → μόνο Παρασκευή
  workflow_dispatch: {}

permissions:
  issues: write
  contents: read

concurrency:
  group: results-reconciler
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Reconciler (interim + annual)
        id: run
        run: |
          python .github/scripts/results_reconciler.py --both \
            --cid-map .github/scripts/euronext_cid_map.json \
            --data-js assets/data.js \
            --out .github/monitor/reconciler_report.md

      # ΔΙΟΡΘΩΣΗ 2026-09-05: ίδιο πρόβλημα με τον Euronext Monitor — το Issue και τα
      # σχόλια δημιουργούνταν χωρίς @mention/assignee, οπότε δεν έφτανε ειδοποίηση
      # (το #4 της 28/08 έμεινε απαρατήρητο). Προστέθηκε @mention στο σώμα και στα
      # σχόλια ανανέωσης — ειδοποιεί σίγουρα και δεν μπορεί να αποτύχει σαν API call.
      - name: Ενημέρωση / κλείσιμο issue
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          HAS_NEW: ${{ steps.run.outputs.has_new }}
          NEW_COUNT: ${{ steps.run.outputs.new_count }}
        run: |
          set -e
          # ΔΙΟΡΘΩΣΗ 2026-09-05: χωρίς @mention/assignee δεν έφτανε ειδοποίηση.
          # ΔΙΟΡΘΩΣΗ 2026-09-08 (α): το `gh issue edit` (σώμα) ΔΕΝ ειδοποιεί ποτέ — οι
          #   επεξεργασίες σώματος είναι σιωπηλές. Η ΠΛΗΡΗΣ αναφορά μπαίνει στο ΣΧΟΛΙΟ.
          # ΔΙΟΡΘΩΣΗ 2026-09-08 (β): email και στο «όλα καθαρά». Άρα δουλεύουμε πάνω σε ΕΝΑ
          #   σταθερό issue ΑΝΕΞΑΡΤΗΤΑ κατάστασης — τα σχόλια ειδοποιούν και σε κλειστό issue.
          gh label create reconciler --color C6A24E --description "Εκκρεμείς δημοσιεύσεις αποτελεσμάτων" 2>/dev/null || true

          TITLE="🎯 Results Reconciler — αποτελέσματα περιόδου"
          REPORT=.github/monitor/reconciler_report.md
          BODY="$RUNNER_TEMP/issue_body.md"
          COMMENT="$RUNNER_TEMP/issue_comment.md"
          NOW=$(date -u '+%Y-%m-%d %H:%M')

          printf '@%s\n\n' "$OWNER" > "$BODY"
          cat "$REPORT" >> "$BODY"

          NUM=$(gh issue list --label reconciler --state all --limit 1 --json number --jq '.[0].number' 2>/dev/null || echo "")
          CREATED=0
          if [ -z "$NUM" ]; then
            URL=$(gh issue create --title "$TITLE" --body-file "$BODY" --label reconciler)
            NUM=$(basename "$URL")
            CREATED=1
            STATE="OPEN"
            gh issue edit "$NUM" --add-assignee "$OWNER" || echo "::warning::Απέτυχε η ανάθεση (το @mention ισχύει)"
            echo "Opened new issue: $URL"
          else
            STATE=$(gh issue view "$NUM" --json state --jq .state)
            gh issue edit "$NUM" --body-file "$BODY"
          fi

          # Το σχόλιο είναι ΤΟ ΚΑΝΑΛΙ ΤΟΥ EMAIL — κουβαλά πάντα ολόκληρη την αναφορά.
          # (Στη δημιουργία το παραλείπουμε: το ίδιο το issue ειδοποίησε ήδη.)
          if [ "$CREATED" = "0" ]; then
            if [ "$HAS_NEW" = "true" ]; then
              printf '@%s 🔄 Ανανεώθηκε %sZ — εκκρεμούν **%s**.\n\n---\n\n' "$OWNER" "$NOW" "$NEW_COUNT" > "$COMMENT"
            else
              printf '@%s ✅ Όλα καθαρά — %sZ. Καμία εκκρεμότητα.\n\n---\n\n' "$OWNER" "$NOW" > "$COMMENT"
            fi
            cat "$REPORT" >> "$COMMENT"
            gh issue comment "$NUM" --body-file "$COMMENT"
          fi

          if [ "$HAS_NEW" = "true" ]; then
            if [ "$STATE" = "CLOSED" ]; then gh issue reopen "$NUM"; fi
            echo "Issue #$NUM — εκκρεμούν $NEW_COUNT"
          else
            if [ "$STATE" = "OPEN" ]; then gh issue close "$NUM"; fi
            echo "Issue #$NUM — όλα καθαρά ✅"
          fi
